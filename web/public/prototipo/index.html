<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LevaGo: app Cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b2a4a;--navy2:#123a63;--or:#ff6b00;--bg:#fff;--fg:#10223a;--mut:#5f6b7a;--line:#dfe3e8;--soft:#fdebdc;--card:#f6f7f9;--ok:#1a8a3a;--bad:#c9151e;--info:#e3eefc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b2b;--fg:#eaf0f7;--mut:#9aa8b8;--line:#263548;--soft:#2e2014;--card:#162538;--info:#17304f}}
:root[data-theme="dark"]{--bg:#0f1b2b;--fg:#eaf0f7;--mut:#9aa8b8;--line:#263548;--soft:#2e2014;--card:#162538;--info:#17304f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#050d18;font:16px/1.45 "Segoe UI",Roboto,Arial,sans-serif;color:var(--fg)}
#app{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--navy);display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0)}
.hd{display:flex;align-items:center;gap:.6rem;color:#fff;padding:.8rem 1rem 1rem;min-height:3.6rem}
.hd h1{flex:1;margin:0;font-size:1.25rem;text-align:center}.hd .bk,.hd .rt{width:2rem;background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer;position:relative}
.logo{font-style:italic;font-weight:800;font-size:1.6rem;color:#fff}.logo b{color:var(--or)}
.sheet{flex:1;background:var(--bg);border-radius:26px 26px 0 0;padding:1.1rem 1rem 6rem;overflow:auto}
.tabs{position:sticky;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);padding:.4rem 0 calc(.4rem + env(safe-area-inset-bottom,0));margin-top:-5rem}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:.7rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.1rem}.tabs button i{font-style:normal;font-size:1.3rem}.tabs button.on{color:var(--or);font-weight:700}
.badge{position:absolute;top:-.1rem;right:-.1rem;background:var(--or);color:#fff;font-size:.65rem;border-radius:99px;padding:0 .35rem}
.btn{display:block;width:100%;border:0;border-radius:99px;padding:.9rem;font:inherit;font-size:1.05rem;font-weight:700;background:var(--or);color:#fff;cursor:pointer;margin-top:.6rem;text-align:center;text-decoration:none}
.btn.o{background:transparent;border:2px solid var(--fg);color:var(--fg)}.btn.g{background:var(--card);color:var(--fg)}.btn.r{background:var(--bad)}.btn.oo{background:transparent;border:2px solid var(--or);color:var(--or)}.btn:disabled{opacity:.5}
label{display:block;font-weight:700;margin:.8rem 0 .25rem}.req{color:var(--or)}
input,select,textarea{width:100%;font:inherit;padding:.75rem;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}
.hint{font-size:.82rem;color:var(--mut);margin:.2rem 0 0}
.ph{display:grid;grid-template-columns:5.5rem 1fr;gap:.5rem}
.ck{display:flex;gap:.6rem;align-items:center;margin:.7rem 0}.ck input{width:1.3rem;height:1.3rem;accent-color:var(--or)}
.lnk{color:var(--or);font-weight:700;text-decoration:underline;background:none;border:0;font:inherit;cursor:pointer;padding:0}
.hero{flex:1;display:flex;flex-direction:column;padding:1.5rem 1.2rem 1.2rem;color:#fff;background:linear-gradient(180deg,#0b2a4a 0%,#1b3f66 45%,#0b2a4a 100%)}
.hero h2{font-size:2rem;line-height:1.1;margin:1.5rem 0 .6rem}.hero h2 em{color:var(--or)}
.chips{display:flex;gap:.4rem;margin:1rem 0}.chips span{flex:1;text-align:center;border:1px solid #3a5878;border-radius:99px;padding:.45rem .2rem;font-size:.8rem}
.box{border:1px solid #3a5878;border-radius:12px;padding:.6rem .8rem;font-size:.82rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem;margin:.6rem 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.plan{border:2px solid var(--line);border-radius:14px;padding:.7rem;text-align:center;position:relative}.plan.rec{border-color:var(--or)}
.plan .p{color:var(--or);font-weight:800;font-size:1.25rem}.plan .q{font-weight:700}.plan small{color:var(--mut);display:block}
.plan .tg{position:absolute;top:-.65rem;left:50%;transform:translateX(-50%);background:var(--or);color:#fff;font-size:.7rem;font-weight:700;padding:.05rem .6rem;border-radius:99px}
.plan .btn{padding:.5rem;font-size:.95rem}
.alert{background:var(--soft);border-radius:12px;padding:.8rem;margin:.6rem 0}.info{background:var(--info);border-radius:12px;padding:.8rem;margin:.6rem 0;display:flex;gap:.5rem}
.row{display:flex;align-items:center;gap:.8rem;padding:.8rem;border:1px solid var(--line);border-radius:14px;margin:.5rem 0;cursor:pointer;background:var(--bg)}
.row .ic{font-size:1.5rem;width:2rem;text-align:center}.row .t{flex:1}.row small{display:block;color:var(--mut)}.row.pri{background:var(--or);color:#fff;border:0}.row.pri small{color:#ffe3d0}
.row.del{color:var(--bad)}
.st{display:flex;margin:.6rem 0 1rem}.st div{flex:1;text-align:center;font-size:.72rem;color:var(--mut)}.st b{display:grid;place-items:center;width:2rem;height:2rem;margin:0 auto .2rem;border-radius:50%;border:2px solid var(--line);color:var(--fg)}
.st .on b{background:var(--or);border-color:var(--or);color:#fff}.st .on{color:var(--fg);font-weight:700}.st .dn b{background:var(--ok);border-color:var(--ok);color:#fff}
.bar{display:flex;gap:.3rem;margin:.5rem 0}.bar i{flex:1;height:5px;border-radius:3px;background:var(--line)}.bar i.on{background:var(--or)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.opt{border:2px solid var(--line);border-radius:12px;padding:.7rem;cursor:pointer}.opt.on{border-color:var(--or);background:var(--soft)}.opt small{display:block;color:var(--mut)}
.pill{display:inline-block;padding:.5rem .9rem;border:1px solid var(--line);border-radius:99px;margin:.2rem .2rem 0 0;cursor:pointer}.pill.on{background:var(--fg);color:var(--bg)}
.sum div{display:flex;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line)}.sum b{min-width:5.5rem}
.tot{display:flex;justify-content:space-between;background:var(--soft);padding:.8rem;border-radius:12px;font-weight:800;font-size:1.15rem;margin:.8rem 0}.tot span:last-child{color:var(--or)}
.code{font-size:2.4rem;font-weight:800;letter-spacing:.4rem}
.s{display:inline-block;padding:.1rem .6rem;border-radius:8px;font-size:.78rem;font-weight:700;background:#d7f3de;color:#14602a}.s.c{background:#fadada;color:#8c1c1c}.s.n{background:var(--info)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:.15rem}.cal b{font-size:.8rem}.cal button{background:none;border:0;border-radius:8px;padding:.5rem 0;font:inherit;color:var(--fg);cursor:pointer}.cal button.on{background:#1e63e8;color:#fff}.cal button:disabled{color:var(--line)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.6rem}.slots button{padding:.7rem;border:1px solid var(--line);border-radius:12px;background:none;color:var(--fg);font:inherit;cursor:pointer}.slots button.on{background:var(--or);color:#fff;border-color:var(--or)}
.star{font-size:2.2rem;cursor:pointer;color:var(--line);background:none;border:0}.star.on{color:var(--or)}
.map{height:12rem;border-radius:14px;background:#e7ecef;overflow:hidden}
.mut{color:var(--mut)}.c{text-align:center}
#toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:#000c;color:#fff;padding:.6rem 1rem;border-radius:99px;font-size:.9rem;display:none;z-index:9;max-width:90vw}

.hero{padding:0 0 1.2rem}.hero>*:not(.band){margin-left:1.2rem;margin-right:1.2rem}
.band{height:11rem;background-size:cover;background-position:center;position:relative;display:flex;justify-content:center;padding-top:1rem;margin:0}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,42,74,.6),rgba(11,42,74,0) 40%,#0b2a4a 100%)}.band .logo{position:relative;z-index:1;text-shadow:0 2px 8px #0008}
.hc{position:relative;min-height:12.5rem;margin-top:-1.5rem}.hc h2,.hc .hp{position:relative;z-index:1;max-width:62%}.hc .hp{margin:0}
.cour{position:absolute;right:-1.2rem;top:-1rem;width:46%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%),linear-gradient(0deg,transparent,#000 30%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 45%),linear-gradient(0deg,transparent,#000 30%);mask-composite:intersect}
.hb{display:flex;align-items:center;gap:.5rem;color:#fff;padding:.2rem 1.1rem 1rem}.hb h1{margin:0 0 .3rem;font-size:2rem}.hb p{margin:0;max-width:15rem;color:#dbe4ee}.hb .bx{font-size:4.5rem;margin-left:auto;filter:drop-shadow(0 6px 10px #0006)}
.fl{display:flex;gap:.7rem;margin:.9rem 0}.fi{font-size:1.4rem;width:1.8rem;text-align:center;padding-top:.15rem}.fb{flex:1;min-width:0}.fb label{margin:0 0 .25rem}
.pw{position:relative}.pw input{padding-right:6.2rem}.pw .lnk{position:absolute;right:.8rem;top:.8rem;text-decoration:none;font-size:.9rem}
.lh{position:relative;height:19rem;background-size:cover;background-position:center;overflow:hidden}
.lh::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,42,74,.45),rgba(11,42,74,.25) 50%,#0b2a4a 100%)}
.lh .bk{position:absolute;z-index:3;left:.6rem;top:.8rem;background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer}
.lh .lg{position:absolute;z-index:2;top:.8rem;left:50%;transform:translateX(-50%)}
.wm{position:absolute;z-index:1;left:0;bottom:0;height:88%;-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent);mask-image:linear-gradient(90deg,#000 55%,transparent)}
.lt{position:absolute;z-index:2;right:1rem;bottom:3rem;width:52%;color:#fff}.lt h2{margin:0 0 .3rem;font-size:1.5rem;line-height:1.15}.lt p{margin:0;font-size:.9rem}
.lc{position:relative;z-index:2;background:var(--bg);margin:-2.2rem .8rem 1.5rem;border-radius:22px;padding:.5rem 1rem 1rem}
.who{display:flex;align-items:center;gap:.8rem}.av{width:3.6rem;height:3.6rem;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--line)}
.bigck{width:5.5rem;height:5.5rem;border-radius:50%;background:var(--ok);color:#fff;font-size:3rem;display:grid;place-items:center;margin:0 auto}
.st div{position:relative}.st div+div::before{content:"";position:absolute;top:1rem;right:50%;width:100%;height:2px;background:var(--line)}.st div.on::before,.st div.dn::before{background:var(--or)}.st b{position:relative;z-index:1;background:var(--bg)}.st .on b{background:var(--or)}.st .dn b{background:var(--ok)}
.plan small{border-top:1px solid var(--line);margin:.4rem 0;padding-top:.4rem}

:root{--navy:#022846;--bd:#cdd4dd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bd:#2f4258}}
:root[data-theme="dark"]{--bd:#2f4258}
body{display:flex;justify-content:center;align-items:center;margin:0;min-height:100dvh}
#app{width:100%;max-width:430px;height:100dvh;min-height:0;overflow:hidden}
@media (min-width:600px){#app{height:min(900px,96dvh);border-radius:38px;box-shadow:0 0 0 9px #18283b,0 24px 70px #000b}}
.sheet{flex:1;min-height:0;overflow-y:auto;padding:1.1rem 1rem 1.4rem;border-radius:28px 28px 0 0}.sheet.up{margin-top:-1px}
.tabs{position:static;margin-top:0;flex:none;box-shadow:0 -2px 8px rgba(16,34,58,.06)}
.scr{flex:1;min-height:0;overflow-y:auto;background:var(--navy)}
.hero{flex:1;min-height:0;overflow-y:auto;padding:0;background:linear-gradient(180deg,var(--navy),#08203a)}.hero>*:not(.band){margin-left:0;margin-right:0}
.himg{position:relative;line-height:0;background:var(--navy)}.himg img{display:block;width:100%;height:auto}
.hero .himg img{-webkit-mask-image:linear-gradient(180deg,#000 90%,transparent);mask-image:linear-gradient(180deg,#000 90%,transparent)}
.bkov{position:absolute;left:0;top:0;width:4.2rem;height:4.2rem;background:none;border:0;cursor:pointer}
.hl{padding:0 1.1rem 1.2rem;margin-top:-.4rem}
.chips{display:flex;gap:.5rem;margin:.2rem 0 .7rem}.chips span{flex:1;display:flex;align-items:center;justify-content:center;gap:.35rem;border:1px solid #35557a;background:#ffffff0d;border-radius:14px;padding:.6rem .2rem;font-size:.82rem;font-weight:600;color:#fff}.chips i{font-style:normal;color:var(--or)}
.box{display:flex;gap:.7rem;align-items:center;border:1px solid #35557a;background:#ffffff0d;border-radius:14px;padding:.7rem .8rem;font-size:.78rem;color:#fff;margin-bottom:.4rem}.box i{font-style:normal;font-size:1.5rem}
.btn.w{color:#fff;border-color:#fff}
.sep{display:flex;align-items:center;gap:.5rem;justify-content:center;color:#fff;margin-top:.9rem;font-size:.95rem}.sep::before,.sep::after{content:"";flex:1;height:1px;background:#35557a}.sep .lnk{color:var(--or)}
.lc{position:relative;background:var(--bg);margin:-1.4rem 0 0;border-radius:26px 26px 0 0;padding:.6rem 1.1rem 1.6rem;min-height:55%}
.who2{display:flex;justify-content:space-between;align-items:center;gap:.5rem;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:.8rem 1rem;margin-top:.8rem}
.lgimg{height:2.5rem;width:auto;display:block;margin-bottom:.15rem}
.map img{display:block;width:100%;height:auto}.map{height:auto;background:none}
input,select,textarea{border:1px solid var(--bd);border-radius:14px;padding:.85rem .9rem;font-size:1rem;min-height:3.1rem}
label{font-weight:700;font-size:1rem;margin:.9rem 0 .3rem}
.hint{font-size:.8rem;color:var(--mut)}
.row{border:1px solid var(--bd);border-radius:16px;padding:.95rem 1rem;box-shadow:0 1px 2px rgba(16,34,58,.06),0 4px 12px rgba(16,34,58,.05)}
.row.pri{background:linear-gradient(90deg,#ff6200,#ff7d1f);border:0;box-shadow:0 6px 16px rgba(255,98,0,.3)}
.card{border:1px solid var(--bd);border-radius:16px;box-shadow:0 1px 2px rgba(16,34,58,.05)}
.btn{min-height:3.3rem;font-size:1.08rem;box-shadow:0 4px 12px rgba(255,98,0,.25)}.btn.o,.btn.g,.btn.oo,.btn.w{box-shadow:none}.btn.o{border-width:1.5px}
.plan{border:1.5px solid var(--bd);border-radius:16px;padding:.8rem .6rem}.plan.rec{border:2px solid var(--or)}
.plan .btn{border-radius:12px;min-height:0;padding:.55rem;font-size:1rem;box-shadow:none}.plan .btn.o{border:1.5px solid var(--bd);color:var(--fg)}
.alert{border-radius:14px;color:#5a3a1a}.info{border-radius:14px}
.hd h1{font-size:1.35rem}
.st b{width:2.2rem;height:2.2rem;border:1.5px solid var(--bd)}.st div+div::before{top:1.1rem;background:var(--bd)}
.sum div{border-bottom:1px solid var(--bd)}.tot{border-radius:14px}
.pill{border:1px solid var(--bd)}

/* tipografia e bordas refinadas */
:root{--font:"Plus Jakarta Sans","Manrope","Nunito Sans","Segoe UI Variable Text","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--bd:#e0e5ec;--bi:#c2cad5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bd:#27384d;--bi:#3b5069}}
:root[data-theme="dark"]{--bd:#27384d;--bi:#3b5069}
body,button,input,select,textarea{font-family:var(--font)}
body{font-size:15.5px;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-weight:800;letter-spacing:-.02em}h2{font-size:1.45rem;line-height:1.2}h3{font-size:1.08rem;font-weight:700;letter-spacing:-.01em}
.hd h1{font-size:1.3rem;font-weight:700;letter-spacing:-.015em}
label{font-size:.95rem;font-weight:700;color:var(--fg)}
.hint{font-size:.78rem;line-height:1.4}
input,select,textarea{border:1px solid var(--bi);border-radius:12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px rgba(255,107,0,.18)}
input::placeholder,textarea::placeholder{color:#8a96a6;font-weight:400}
.btn{font-weight:700;letter-spacing:.005em}
.row,.card,.plan,.who2,.opt,.pill{border:1px solid var(--bd)}
.row,.card{border-radius:16px;box-shadow:0 1px 2px rgba(16,34,58,.05)}
.row{transition:transform .1s}.row:active{transform:scale(.99)}
.row.pri{border:0}.plan.rec,.opt.on{border:1.5px solid var(--or)}.plan .btn.o{border:1px solid var(--bi)}
.opt{border-radius:14px}.pill{border-color:var(--bi)}
.sum div{border-bottom:1px solid var(--bd)}.plan small{border-top:1px solid var(--bd)}
.st b{border:1.5px solid var(--bi)}.st div+div::before{background:var(--bi);height:1.5px}
.tabs{border-top:1px solid var(--bd);box-shadow:none}.tabs button{font-size:.68rem;font-weight:600}.tabs button.on{font-weight:700}
.plan .p{font-weight:800;font-size:1.3rem;letter-spacing:-.02em}.plan b{font-weight:700}
.code{font-weight:800}.s,.tag{font-weight:700;letter-spacing:.01em}
.row b{font-weight:700}.row small{font-size:.82rem}
.chips span,.box{border-color:#3a5b82}
</style>
</head>
