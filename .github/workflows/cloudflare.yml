# Publica o LevaGo 2.0 na Cloudflare: o site e a API (em /v1) no Pages (levago), e a API também num Worker (levago-api).
# Corre sozinho em cada envio para main. Também pode correr à mão: Actions > Cloudflare > Run workflow.
# Em todos os casos gera 2 pacotes (Artifacts) para subir à mão no painel da Cloudflare:
#   levago-site (pasta do site) e levago-api (worker.js). Ver docs/CLOUDFLARE.md.
name: Cloudflare

on:
  push:
    branches: [main]
    paths-ignore: ['mobile/**', '.github/workflows/apk.yml']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar já na Cloudflare? Sem marcar, só gera os pacotes para subir à mão.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: e05eeae53ace56c96df2f49e36c750a5
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Publicação automática ou só pacotes
        id: modo
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "auto=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem o segredo CLOUDFLARE_API_TOKEN: só gera os pacotes para subir à mão."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publicar }}" != "true" ]; then
            echo "auto=false" >> "$GITHUB_OUTPUT"
          else
            echo "auto=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pacote da API (worker.js)
        working-directory: api
        run: npx wrangler deploy --dry-run --outdir ../pacotes/levago-api

      - name: Publicar a API
        id: api
        if: steps.modo.outputs.auto == 'true'
        working-directory: api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Só envia os segredos que existem no GitHub; os outros ficam como estão na Cloudflare.
          node -e 'const s={};for(const k of ["DATABASE_URL","RESEND_API_KEY","CRON_SECRET"])if(process.env[k])s[k]=process.env[k];require("fs").writeFileSync(process.env.RUNNER_TEMP+"/secrets.json",JSON.stringify(s))'
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" | tee "$RUNNER_TEMP/api.log"
          rm -f "$RUNNER_TEMP/secrets.json"
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/api.log" | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Construir o site (com a API no mesmo endereço, pasta functions/)
        run: npm run build

      - name: Publicar o site e a API em /v1 (Pages)
        id: site
        if: steps.modo.outputs.auto == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          npx wrangler pages project create levago --production-branch main 2>/dev/null || true
          node -e 'const s={};for(const k of ["DATABASE_URL","RESEND_API_KEY","CRON_SECRET"])if(process.env[k])s[k]=process.env[k];require("fs").writeFileSync(process.env.RUNNER_TEMP+"/secrets.json",JSON.stringify(s))'
          npx wrangler pages secret bulk "$RUNNER_TEMP/secrets.json" --project-name levago || true
          rm -f "$RUNNER_TEMP/secrets.json"
          npx wrangler pages deploy --branch main --commit-dirty=true | tee "$RUNNER_TEMP/site.log"

      - name: Pacote do site para subir à mão (usa a API do Worker)
        env:
          VITE_API_URL: ${{ steps.api.outputs.url || vars.LEVAGO_API_URL }}
        run: |
          # O painel do Pages (arrastar a pasta) não leva a pasta functions/, por isso este pacote chama o Worker.
          if [ -z "$VITE_API_URL" ]; then
            echo "::warning::Sem o endereço do Worker levago-api, o pacote levago-site não foi gerado. Crie a variável LEVAGO_API_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 0
          fi
          npm run build -w web
          mkdir -p pacotes && cp -r web/dist pacotes/levago-site

      - uses: actions/upload-artifact@v4
        with:
          name: levago-site
          path: pacotes/levago-site
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: levago-api
          path: pacotes/levago-api/worker.js

      - name: Resumo
        run: |
          {
            echo "## LevaGo na Cloudflare"
            if [ "${{ steps.modo.outputs.auto }}" = "true" ]; then
              echo "- Site e API: https://levago.pages.dev (API em /v1)"
              echo "- API também no Worker: ${{ steps.api.outputs.url }}"
            else
              echo "Não publicado. Para subir à mão, descarregue os pacotes **levago-site** e **levago-api** em Artifacts (mais abaixo) e siga docs/CLOUDFLARE.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
