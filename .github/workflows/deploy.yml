# Testa e publica o LevaGo 2.0 no Cloudflare.
# Precisa dos segredos do repositório CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
# Opcional: PAYMENTS_WEBHOOK_SECRET (só quando houver um provedor de pagamentos real).
name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  D1_NAME: levago
  R2_BUCKET: levago-files
  PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'levago' }}

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API, testes unitários e tipos
        working-directory: api
        run: npx vitest run && npx tsc --noEmit
      - name: API, fluxo ponta a ponta (D1 local)
        working-directory: api
        run: npm run test:e2e
      - name: Site, compilar
        working-directory: web
        run: npm run build

  deploy:
    name: Publicar no Cloudflare
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAYMENTS_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_WEBHOOK_SECRET }}
    steps:
      - name: Verificar segredos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Base de dados D1 (criar se não existir)
        id: d1
        working-directory: api
        run: |
          set -euo pipefail
          ID=$(npx wrangler d1 list --json | jq -r --arg n "$D1_NAME" '.[] | select(.name == $n) | .uuid')
          CREATED=false
          if [ -z "$ID" ]; then
            npx wrangler d1 create "$D1_NAME"
            ID=$(npx wrangler d1 list --json | jq -r --arg n "$D1_NAME" '.[] | select(.name == $n) | .uuid')
            CREATED=true
          fi
          [ -n "$ID" ] || { echo "::error::Não foi possível obter o id da base D1."; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"

      - name: Aplicar migrações
        working-directory: api
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote

      - name: Dados iniciais (zonas e tarifa de teste, só na primeira vez)
        if: steps.d1.outputs.created == 'true'
        working-directory: api
        run: npx wrangler d1 execute "$D1_NAME" --remote --file seed/staging.sql

      - name: Armazenamento R2 (criar se não existir)
        working-directory: api
        run: |
          if ! OUT=$(npx wrangler r2 bucket create "$R2_BUCKET" 2>&1); then
            echo "$OUT"
            echo "$OUT" | grep -qi "already exist" || exit 1
          fi

      - name: Projecto do site no Pages (criar se não existir)
        id: pages
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if ! curl -fsS -H "$AUTH" "$API/$PAGES_PROJECT" > /dev/null 2>&1; then
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch main
          fi
          SUB=$(curl -fsS -H "$AUTH" "$API/$PAGES_PROJECT" | jq -r '.result.subdomain')
          echo "url=https://$SUB" >> "$GITHUB_OUTPUT"

      - name: Publicar a API (Worker)
        id: api
        working-directory: api
        env:
          SITE_URL: ${{ steps.pages.outputs.url }}
        run: |
          set -euo pipefail
          npx wrangler deploy --var "CORS_ORIGINS:$SITE_URL" | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::Não encontrei o endereço workers.dev. Active o subdomínio workers.dev na conta Cloudflare."; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Segredo do webhook de pagamentos
        if: env.PAYMENTS_WEBHOOK_SECRET != ''
        working-directory: api
        run: printf '%s' "$PAYMENTS_WEBHOOK_SECRET" | npx wrangler secret put PAYMENTS_WEBHOOK_SECRET

      - name: Compilar e publicar o site (Pages)
        env:
          VITE_API_URL: ${{ steps.api.outputs.url }}
        run: |
          npm run build -w web
          npx wrangler pages deploy web/dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

      - name: Resumo
        run: |
          {
            echo "### LevaGo 2.0 publicado"
            echo "- Site: ${{ steps.pages.outputs.url }}"
            echo "- API: ${{ steps.api.outputs.url }}/v1/config"
          } >> "$GITHUB_STEP_SUMMARY"
