# Publica o LevaGo 2.0 no Cloudflare, um passo de cada vez.
# Correr à mão: Actions > Publicar no Cloudflare > Run workflow > escolher o passo.
# Ordem: 1-base-de-dados, 2-armazenamento, 3-api, 4-site.
# Precisa dos segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
# Opcional: PAYMENTS_WEBHOOK_SECRET (só quando houver um provedor de pagamentos real).
name: Publicar no Cloudflare

on:
  workflow_dispatch:
    inputs:
      passo:
        description: Passo a executar
        required: true
        type: choice
        options:
          - 1-base-de-dados
          - 2-armazenamento
          - 3-api
          - 4-site

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  D1_NAME: levago
  R2_BUCKET: levago-files
  WORKER_NAME: levago-api
  PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'levago' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PAYMENTS_WEBHOOK_SECRET: ${{ secrets.PAYMENTS_WEBHOOK_SECRET }}

jobs:
  publish:
    name: ${{ inputs.passo }}
    runs-on: ubuntu-latest
    steps:
      - name: Verificar segredos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltam os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ---------- 1. Base de dados D1
      - name: Criar a base D1 (se não existir)
        id: d1new
        if: inputs.passo == '1-base-de-dados'
        working-directory: api
        run: |
          set -euo pipefail
          ID=$(npx wrangler d1 list --json | jq -r --arg n "$D1_NAME" '.[] | select(.name == $n) | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create "$D1_NAME"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ligar à base D1
        if: inputs.passo == '1-base-de-dados' || inputs.passo == '3-api'
        working-directory: api
        run: |
          set -euo pipefail
          ID=$(npx wrangler d1 list --json | jq -r --arg n "$D1_NAME" '.[] | select(.name == $n) | .uuid')
          [ -n "$ID" ] || { echo "::error::A base D1 ainda não existe. Corra primeiro o passo 1-base-de-dados."; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml

      - name: Aplicar migrações
        if: inputs.passo == '1-base-de-dados'
        working-directory: api
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote

      - name: Dados iniciais (zonas e tarifa de teste, só na primeira vez)
        if: inputs.passo == '1-base-de-dados' && steps.d1new.outputs.created == 'true'
        working-directory: api
        run: npx wrangler d1 execute "$D1_NAME" --remote --file seed/staging.sql

      # ---------- 2. Armazenamento R2
      - name: Criar o armazenamento R2 (se não existir)
        if: inputs.passo == '2-armazenamento'
        working-directory: api
        run: |
          if ! OUT=$(npx wrangler r2 bucket create "$R2_BUCKET" 2>&1); then
            echo "$OUT"
            echo "$OUT" | grep -qi "already exist" || exit 1
          fi
          echo "Armazenamento $R2_BUCKET pronto."

      # ---------- Endereços (usados pela API e pelo site)
      - name: Endereços do site e da API
        id: urls
        if: inputs.passo == '3-api' || inputs.passo == '4-site'
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          SUB=$(curl -fsS -H "$AUTH" "$BASE/workers/subdomain" | jq -r '.result.subdomain // empty')
          [ -n "$SUB" ] || { echo "::error::A conta não tem subdomínio workers.dev. Abra Workers & Pages no painel do Cloudflare uma vez para o activar."; exit 1; }
          echo "api=https://$WORKER_NAME.$SUB.workers.dev" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.passo }}" = "4-site" ] && ! curl -fsS -H "$AUTH" "$BASE/pages/projects/$PAGES_PROJECT" > /dev/null 2>&1; then
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch main
          fi
          SITE=$(curl -fsS -H "$AUTH" "$BASE/pages/projects/$PAGES_PROJECT" 2>/dev/null | jq -r '.result.subdomain // empty' || true)
          echo "site=${SITE:+https://$SITE}" >> "$GITHUB_OUTPUT"

      # ---------- 3. API (Worker)
      - name: Publicar a API
        if: inputs.passo == '3-api'
        working-directory: api
        env:
          SITE_URL: ${{ steps.urls.outputs.site }}
        run: |
          set -euo pipefail
          if [ -n "$SITE_URL" ]; then
            npx wrangler deploy --var "CORS_ORIGINS:$SITE_URL"
          else
            echo "::warning::O site ainda não existe. Depois do passo 4-site, corra outra vez o passo 3-api para autorizar o endereço do site."
            npx wrangler deploy
          fi

      - name: Segredo do webhook de pagamentos
        if: inputs.passo == '3-api' && env.PAYMENTS_WEBHOOK_SECRET != ''
        working-directory: api
        run: printf '%s' "$PAYMENTS_WEBHOOK_SECRET" | npx wrangler secret put PAYMENTS_WEBHOOK_SECRET

      # ---------- 4. Site (Pages)
      - name: Compilar e publicar o site
        if: inputs.passo == '4-site'
        env:
          VITE_API_URL: ${{ steps.urls.outputs.api }}
        run: |
          npm run build -w web
          npx wrangler pages deploy web/dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

      - name: Resumo
        if: inputs.passo == '3-api' || inputs.passo == '4-site'
        run: |
          {
            echo "### Passo ${{ inputs.passo }} concluído"
            echo "- API: ${{ steps.urls.outputs.api }}/v1/config"
            [ -n "${{ steps.urls.outputs.site }}" ] && echo "- Site: ${{ steps.urls.outputs.site }}"
            true
          } >> "$GITHUB_STEP_SUMMARY"
